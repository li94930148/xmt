name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:entrypoints
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run version:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  core-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update
      - run: sudo apt-get install --yes redis-server
      - run: npm run test:ci

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run mobile:sync:production
      - run: npm run test:android-build-endpoints
      - run: cd android && ./gradlew assembleDebug
      - run: npm run test:apk-endpoint-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: xmt-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  creator-agent-package-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: npm --prefix agent run electron:build
      - run: npm --prefix agent run test:package-runtime

  creator-agent-macos-arm64-package-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: python -m venv collector/.venv
      - run: npm --prefix agent run electron:build:mac
      - run: npm --prefix agent run test:package-runtime:mac
      - uses: actions/upload-artifact@v4
        with:
          # The build script derives the archive version from agent/package.json.
          # CI must not pin a previous release or turn a validated package into a
          # failed run solely during artifact publication.
          name: xmt-creator-agent-macos-arm64
          path: agent/release/XMT-Creator-Agent-v*-macos-arm64.zip
          if-no-files-found: error

  collector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: python -m venv collector/.venv
      - run: collector/.venv/bin/python -m pip install -r collector/requirements.lock
      - run: npm --prefix agent run test:renderer-security
      - run: npm --prefix agent run test:collector-bridge
      - run: npm --prefix agent run test:collector-browser-auth
      - run: npm --prefix agent run test:collector-cli-export-assertion
      - run: collector/.venv/bin/python -m pytest collector/tests -q
