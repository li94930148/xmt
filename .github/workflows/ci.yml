name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm run build

  core-security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:topics
      - run: npm run test:api-contract
      - run: npm run test:auth
      - run: npm run test:rbac-invariant
      - run: npm run test:auth-session-service
      - run: npm run test:auth-v1
      - run: npm run test:login-gateway
      - run: npm run test:socket
      - run: npm run test:socket-client-lifecycle
      - run: npm run test:socket-coordinator
      - run: npm run test:origin-policy
      - run: npm run test:origin-cors
      - run: npm run test:internal-access
      - run: npm run test:runtime-env
      - run: npm run test:production-bind
      - run: npm run test:internal-exposure-gate
      - run: npm run test:mobile-safe-draft
      - run: npm run test:mobile-network
      - run: npm run test:mobile-message-category
      - run: npm run test:mobile-back-button
      - run: npm run test:mobile-deep-link
      - run: npm run test:mobile-device-registry
      - run: npm run test:android-endpoint-contract
      - run: npm run test:mobile-health-response-contract
      - run: npm run test:daily-report-permissions
      - run: npm run test:android-runtime
      - run: npm run test:mobile-auth-runtime
      - run: npm run test:native-auth-refresh-scheduler
      - run: npm run test:native-auth-runtime-integration
      - run: npm run test:mobile-production-gate
      - run: npm run test:yjs-auth-recovery
      - run: npm run test:collaboration-access
      - run: npm run test:collaboration-socket-authorization
      - run: npm run test:auth-readiness
      - run: npm run test:deploy-safety
      - run: npm run test:ops-ci-status
      - run: npm run test:backup-lock
      - run: npm run test:backup-restore-drill
      - run: npm run test:migration-readiness
      - run: npm run test:version-governance
      - run: npm run test:creator-sync-v2102
      - run: npm run test:creator-agent-replay-security
      - run: npm run test:auth-web-cookie
      - run: npm run test:auth-web-runtime
      - run: npm run test:auth-socket-contract
      - run: npm run test:auth-socket-bridge
      - run: npm run test:socket-production-gate
      - run: npm run test:creator-agent:binding
      - run: npm run test:user-role-assignment-security
      - run: npm run test:html-sanitization
      - run: npm run test:yjs-invalid-update
      - run: npm run test:douyin-webhook-security
      - run: npm run test:user-session-revocation
      - run: npm run test:auth-401-recovery
      - run: npm run test:role-management-security

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm run mobile:sync:production
      - run: npm run test:android-build-endpoints
      - run: cd android && ./gradlew assembleDebug
      - run: npm run test:apk-endpoint-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: xmt-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  creator-agent-package-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: npm --prefix agent run electron:build
      - run: npm --prefix agent run test:package-runtime

  creator-agent-macos-arm64-package-contract:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: python -m venv collector/.venv
      - run: npm --prefix agent run electron:build:mac
      - run: npm --prefix agent run test:package-runtime:mac
      - uses: actions/upload-artifact@v4
        with:
          name: xmt-creator-agent-v2.13.2-macos-arm64
          path: agent/release/XMT-Creator-Agent-v2.13.2-macos-arm64.zip
          if-no-files-found: error

  collector-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm --prefix agent ci
      - run: python -m venv collector/.venv
      - run: collector/.venv/bin/python -m pip install -r collector/requirements.lock
      - run: npm --prefix agent run test:collector-bridge
      - run: npm --prefix agent run test:collector-browser-auth
      - run: npm --prefix agent run test:collector-cli-export-assertion
      - run: collector/.venv/bin/python -m pytest collector/tests -q
