appId: com.lanyaomedia.xmt.creatoragent
productName: XMT Creator Agent
executableName: XMT-Creator-Agent
directories:
  output: release
files:
  - dist-desktop/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/playwright-core/.local-browsers/**/*
extraResources:
  - from: .collector-runtime-build/collector-runtime
    to: collector-runtime
    filter:
      - "**/*"
win:
  target:
    - target: dir
      arch: [x64]
